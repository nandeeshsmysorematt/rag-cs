[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ragcs"
version = "0.1.0"
description = "Retrieval-Augmented Consistency Scoring for model-agnostic hallucination detection"
requires-python = ">=3.9"
dependencies = [
  "torch>=2.1", "transformers>=4.36,<5", "faiss-cpu>=1.7.4", "spacy>=3.5,<4",
  "scikit-learn>=1.3", "numpy>=1.24", "joblib>=1.3", "tqdm>=4.66", "sentencepiece", "protobuf",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["ragcs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
